      - {fill: {zh: ['#reg-email', trainee-xiaoming@example.com], en: ['#reg-email', trainee-alex@example.com]}}
      - {fill: ['#reg-password', '{env:LP_TRAINEE_PW}']}
      - {fill: ['#reg-confirm', '{env:LP_TRAINEE_PW}']}
      - {click: '.v3-auth-card form button[type=submit]'}
      - {wait: '[data-testid=register-success]'}
    clip: .v3-auth-card
    margin: 40
    highlights:
      - {n: 1, box: '[data-testid=register-success] h2', badge: left}
      - {n: 2, box: '[data-testid=register-status]', badge: left}
      - {n: 3, box: '[data-testid=register-success] .v3-auth-submit', badge: left}

