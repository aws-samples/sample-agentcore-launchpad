      - {click: {zh: '.v3-help-menu >> text=术语表', en: '.v3-help-menu >> text=Glossary'}}
      - {wait: .v3-dlc-terms}
    clip: '[role=dialog]'
    margin: 44   # room for the left badges outside the dialog
    highlights:
      - {n: 1, box: '[role=dialog] input.v3-input', badge: left}
      - {n: 2, box: '.v3-dlc-term >> nth=0'}
      - {n: 3, box: '.v3-dlc-term >> nth=0 >> .v3-dlc-term-used', badge: left}

  # ── 10-prepare/30-roles ────────────────────────────────────────────────────
  # Taking this shot IS the walk-through's self-registration: one trainee per
  # language (re-running fails at the wait, the name being taken).
  - name: 15-roles-register-pending
    chapter: 10-prepare/30-roles
    status: keep
    account: anon
    path: /v3
    wait: '[data-testid=auth-tabs]'
    actions:
