AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AgentCore Launchpad workshop host: an ARM64 Ubuntu Server 24.04 LTS EC2 instance
  managed through AWS Systems Manager, with the lab source checked out locally.

Parameters:
  ParticipantRoleArn:
    Type: String
    Description: Workshop Studio participant role ARN attached to the EC2 instance.
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$"
  GitRepositoryUrl:
    Type: String
    Default: https://github.com/aws-samples/sample-agentcore-launchpad.git
    Description: Public HTTPS Git repository containing the AgentCore Launchpad lab.
    AllowedPattern: "^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:\\.git)?$"
  GitBranch:
    Type: String
    Default: v0.0.41
    Description: Git branch or tag to check out.
    AllowedPattern: "^[A-Za-z0-9._/-]+$"
  InstanceType:
    Type: String
    Default: m7g.xlarge
    Description: Graviton xlarge instance type used for the workshop host.
    AllowedValues:
      - m7g.xlarge
      - m6g.xlarge
  RootVolumeSize:
    Type: Number
    Default: 80
    MinValue: 40
    MaxValue: 200
    Description: Root EBS volume size in GiB.

Mappings:
  # com.amazonaws.global.cloudfront.origin-facing, so port 80 on the instance is
  # reachable from CloudFront edges only and not from the open internet. The id
  # is per-region and there is no pseudo-parameter for it, so the two regions
  # this workshop deploys to are mapped explicitly.
  CloudFrontPrefixList:
    us-east-1:
      Id: pl-3b927c52
    us-west-2:
      Id: pl-82a045eb

Resources:
  WorkshopVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: agentcore-launchpad-workshop

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref WorkshopVpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref WorkshopVpc
      Tags:
        - Key: Name
          Value: agentcore-launchpad-workshop-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WorkshopVpc
      Tags:
        - Key: Name
          Value: agentcore-launchpad-workshop-public

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  WorkshopSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Must stay a single-line plain scalar. A YAML folded block (`>`) keeps one
      # trailing newline, and EC2 rejects a newline in a group description with
      # "Invalid security group description".
      GroupDescription: CloudFront-only inbound on port 80 for the Launchpad console, plus egress.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !FindInMap [CloudFrontPrefixList, !Ref "AWS::Region", Id]
          Description: CloudFront edge locations only
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Package downloads and AWS API access
      VpcId: !Ref WorkshopVpc
      Tags:
        - Key: Name
          Value: agentcore-launchpad-workshop

  # CloudFront gives the console a trusted HTTPS name with no certificate to
  # manage. It is not an optimisation: prod mode marks the session cookie
  # `Secure`, so the login gate cannot work over plain HTTP at all.
  #
  # Three standard CloudFront checks are knowingly not satisfied here:
  #
  # * Viewer certificate minimum TLS. Using the `*.cloudfront.net` name means
  #   `CloudFrontDefaultCertificate: true`, and CloudFront then pins the security
  #   policy to `TLSv1` and ignores any `MinimumProtocolVersion` given. Raising it
  #   requires an alternate domain name plus an ACM certificate, which a Workshop
  #   Studio account cannot hold. Not fixable at this layer.
  # * Access logging. Would add a per-team log bucket, and CloudFront standard
  #   logging needs S3 ACLs re-enabled (`ObjectOwnership: BucketOwnerPreferred`)
  #   against current S3 defaults. Skipped: the account is torn down with the
  #   event, and the bootstrap already runs close to its PT45M signal budget.
  # * WAF. A billed WebACL in front of a password-gated console in a throwaway
  #   account buys little; the origin is already closed to everything but this
  #   distribution.
  ConsoleDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "AgentCore Launchpad console (${AWS::StackName})"
        # PriceClass_100 keeps edges in NA/EU. The origin is a single instance in
        # one region either way, so more edges buys nothing here.
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: launchpad-instance
            DomainName: !GetAtt WorkshopInstance.PublicDnsName
            CustomOriginConfig:
              # http-only: there is no certificate on the instance. The hop from
              # the edge to the origin is cleartext inside AWS, which is why the
              # security group admits CloudFront ranges only and nginx demands
              # the secret header below.
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
            OriginCustomHeaders:
              - HeaderName: X-Launchpad-Origin-Key
                HeaderValue: !Join
                  - ""
                  - - !Select [4, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
                    - !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
                    - !Select [3, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
        DefaultCacheBehavior:
          TargetOriginId: launchpad-instance
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingDisabled: the console is entirely dynamic, and caching
          # an authenticated response at the edge would serve one participant's
          # session to the next viewer.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewer: forwards every header, cookie and query string,
          # which the session cookie and SSE streams both need.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

  ParticipantInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Select [1, !Split ["/", !Ref ParticipantRoleArn]]

  TransactionSearchLogsPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: AgentCoreLaunchpadTransactionSearch
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TransactionSearchXRayAccess
            Effect: Allow
            Principal:
              Service: xray.amazonaws.com
            Action: logs:PutLogEvents
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/application-signals/data:*"
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:xray:${AWS::Region}:${AWS::AccountId}:*"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  WorkshopInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DefaultRoute
      - PublicSubnetRouteTableAssociation
      - TransactionSearchLogsPolicy
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT45M
    Properties:
      IamInstanceProfile: !Ref ParticipantInstanceProfile
      ImageId: "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id}}"
      InstanceType: !Ref InstanceType
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref WorkshopSecurityGroup
          SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: agentcore-launchpad-workshop
        - Key: Workshop
          Value: agentcore-launchpad
      # NOTE: EC2 caps encoded UserData at 25600 bytes and this script runs close
      # to that ceiling. Explanation belongs in these YAML comments, which cost
      # nothing, rather than inside the script, which is measured. Check the
      # headroom before adding to it.
      #
      # Publishing the console, in order:
      #  1. Derive two secrets from the stack id. They are derived rather than
      #     generated because CloudFormation cannot hand a generated value to both
      #     a resource property and a participant-visible Output. The stack id is
      #     unique per team, so each team gets its own pair. The password
      #     derivation here must stay in step with the ConsolePassword output.
      #  2. Build the frontend, because vite preview serves frontend/dist.
      #  3. Run backend and frontend under systemd, both bound to loopback. The
      #     credentials go in /etc/launchpad-auth.env at 0600 and reach the unit
      #     through EnvironmentFile, so they never sit in a 0644 unit file.
      #     LAUNCHPAD_AUTH_COOKIE_SECURE=true because TLS terminates at CloudFront;
      #     LAUNCHPAD_AUTH_REGISTRATION_ENABLED=false because upstream defaults it
      #     on, which on a public URL lets anyone with the link register.
      #  4. Put nginx in front, refusing anything without the header CloudFront
      #     injects, so the instance cannot be reached around the distribution.
      #  5. Fail the stack unless the console answers locally AND reports
      #     auth_required, so a successful stack cannot have published an open
      #     console.
      #
      # The model probe fails the stack only when the whole [bedrock] surface is
      # dead, since that is the main line AND ch03's container path, so nothing in
      # the content works. A missing nova or a missing Claude is a loud warning
      # instead: the participant still gets a usable environment and the
      # facilitator can substitute, whereas failing would leave them nothing.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -Eeuo pipefail
          exec > >(tee /var/log/workshop-bootstrap.log | logger -t workshop-bootstrap -s 2>/dev/console) 2>&1

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl unzip

          curl --fail --location --silent --show-error \
            https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip \
            --output /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install

          IMDS_TOKEN="$(curl --fail --silent --show-error --retry 10 \
            --request PUT \
            --header 'X-aws-ec2-metadata-token-ttl-seconds: 21600' \
            http://169.254.169.254/latest/api/token)"
          INSTANCE_ID="$(curl --fail --silent --show-error --retry 10 \
            --header "X-aws-ec2-metadata-token: ${!IMDS_TOKEN}" \
            http://169.254.169.254/latest/meta-data/instance-id)"

          signal_stack() {
            AWS_RETRY_MODE=standard AWS_MAX_ATTEMPTS=10 \
              aws cloudformation signal-resource \
                --stack-name "${AWS::StackName}" \
                --logical-resource-id WorkshopInstance \
                --unique-id "$INSTANCE_ID" \
                --status "$1" \
                --region "${AWS::Region}"
          }
          signal_failure() {
            signal_stack FAILURE || true
          }
          trap signal_failure ERR

          curl --fail --location --silent --show-error \
            https://deb.nodesource.com/setup_22.x \
            --output /tmp/nodesource-setup.sh
          bash /tmp/nodesource-setup.sh

          apt-get install -y \
            build-essential \
            docker.io \
            git \
            gzip \
            jq \
            make \
            nodejs \
            libssl-dev \
            python3 \
            python3-dev \
            tar \
            unzip

          if snap list amazon-ssm-agent >/dev/null 2>&1; then
            snap start --enable amazon-ssm-agent
          else
            curl --fail --location --silent --show-error \
              "https://s3.${AWS::Region}.amazonaws.com/amazon-ssm-${AWS::Region}/latest/debian_arm64/amazon-ssm-agent.deb" \
              --output /tmp/amazon-ssm-agent.deb
            dpkg -i /tmp/amazon-ssm-agent.deb
            systemctl enable --now amazon-ssm-agent
          fi
          systemctl enable --now docker
          usermod -aG docker ubuntu

          curl --fail --location --silent --show-error \
            https://astral.sh/uv/install.sh \
            --output /tmp/install-uv.sh
          UV_INSTALL_DIR=/usr/local/bin sh /tmp/install-uv.sh
          npm install --global aws-cdk

          install -d -o ubuntu -g ubuntu /home/ubuntu/agentcore_launchpad
          rm -rf /home/ubuntu/agentcore_launchpad
          runuser -u ubuntu -- \
            git clone --depth 1 --branch "${GitBranch}" \
            "${GitRepositoryUrl}" /home/ubuntu/agentcore_launchpad

          apt-get install -y nginx

          cat >/etc/profile.d/agentcore-workshop.sh <<'PROFILE'
          export AWS_REGION=${AWS::Region}
          export AWS_DEFAULT_REGION=${AWS::Region}
          # The app's Settings uses env_prefix="LAUNCHPAD_" and hardcodes
          # region="us-west-2", so AWS_REGION does NOT reach it. Without this the
          # backend reads us-west-2 while every AWS SDK call around it uses the
          # event's real region.
          export LAUNCHPAD_REGION=${AWS::Region}
          export AGENTCORE_LAUNCHPAD_HOME=/home/ubuntu/agentcore_launchpad
          PROFILE
          chmod 0644 /etc/profile.d/agentcore-workshop.sh

          echo "Installing project dependencies and prewarming AgentCore resources..."
          runuser -u ubuntu -- env \
            HOME=/home/ubuntu \
            PATH=/usr/local/bin:/usr/bin:/usr/sbin:/bin:/sbin \
            AWS_REGION="${AWS::Region}" \
            AWS_DEFAULT_REGION="${AWS::Region}" \
            LAUNCHPAD_REGION="${AWS::Region}" \
            bash -c '
              set -Eeuo pipefail
              cd /home/ubuntu/agentcore_launchpad
              (cd backend && uv sync)
              (cd frontend && npm install)
              (cd infra && uv sync)

              ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
              printf -v CDK_ENV "aws://%s/%s" "$ACCOUNT_ID" "$AWS_REGION"
              cdk bootstrap "$CDK_ENV"
              make bootstrap

              TRANSACTION_SEARCH_STATUS=""
              for _ in $(seq 1 120); do
                TRANSACTION_SEARCH_STATUS="$(aws xray get-trace-segment-destination \
                  --query Status --output text)"
                if [[ "$TRANSACTION_SEARCH_STATUS" == "ACTIVE" ]]; then
                  break
                fi
                sleep 5
              done
              if [[ "$TRANSACTION_SEARCH_STATUS" != "ACTIVE" ]]; then
                echo "Transaction Search did not become ACTIVE" >&2
                exit 1
              fi

              chmod 0600 config/launchpad.yaml
            '

          echo "Probing model access for the workshop models..."
          MODEL_REPORT=/home/ubuntu/MODEL-ACCESS.txt
          : >"$MODEL_REPORT"
          cat >>"$MODEL_REPORT" <<HEADER
          # Two hosting surfaces. Every verdict below was produced by a real
          # invoke in ${AWS::Region}. Use the id the chapter names -- do NOT just
          # take the first "available" line, because ch03's container path needs a
          # Claude and the first line is the main line's nova.
          #
          # [bedrock] Bedrock Converse -- THE LAB MAIN LINE.
          #           global.amazon.nova-2-lite-v1:0 runs lab-fund-assistant
          #           (ch02) and lab-fund-advisor (ch03). The Claude ids are for
          #           the ch03 container path only: Claude Agent SDK talks
          #           Anthropic message format and cannot use nova (it deploys
          #           green, then fails the first chat with 400 Malformed input
          #           request). NOTE the console form does NOT default to this
          #           surface -- participants must switch 模型来源 to Bedrock.
          # [mantle]  Bedrock Mantle (Responses API). NOT used by the lab; probed
          #           so the surface is visible and switchable. Only
          #           openai.gpt-oss-* serves the Responses API the generated
          #           Strands code calls. The console default
          #           (openai.gpt-5.6-terra) needs an AWS Marketplace agreement
          #           a Workshop Studio account cannot hold, so it is denied
          #           here and works only in your own AWS account. A [mantle]
          #           verdict covers ${AWS::Region} only -- the zip channel sends
          #           its Mantle call to LAUNCHPAD_MANTLE_REGION (default
          #           us-east-1) regardless of the runtime's region.
          HEADER

          # Mantle has no boto3 client and no AWS CLI command: auth is a bearer
          # token minted client-side by aws-bedrock-token-generator (SigV4
          # presign, no network call), so this probe needs that package and a
          # plain HTTPS POST. Run as ubuntu so uv's cache lands in its HOME.
          cat >/tmp/probe-mantle.py <<'PROBE'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          from aws_bedrock_token_generator import provide_token

          region = sys.argv[1]
          candidates = sys.argv[2:]
          ATTEMPTS = 9
          SLEEP_S = 20
          # Retries ride out transient 5xx and cold-start latency. They do NOT
          # help with a Marketplace denial: the openai.gpt-oss-* candidates do
          # not go through Marketplace at all, and the openai.gpt-5.* family is
          # denied outright rather than pending -- retrying that never converges,
          # which is why those ids are no longer candidates. The catalogue
          # pre-check short-circuits ids this region does not offer. Bounded here
          # because the stack's ResourceSignal timeout (PT45M) also has to cover
          # bootstrap and Transaction Search.
          DEADLINE_S = 150
          started = time.monotonic()


          def base_url(model_id):
              # Mirrors strands/models/_openai_bedrock.py: only the openai.gpt-5.*
              # family is served from /openai/v1, everything else from /v1.
              path = '/openai/v1' if model_id.startswith('openai.gpt-5.') else '/v1'
              return 'https://bedrock-mantle.' + region + '.api.aws' + path


          def catalogue():
              tok = provide_token(region=region)
              req = urllib.request.Request(
                  'https://bedrock-mantle.' + region + '.api.aws/v1/models',
                  headers={'Authorization': 'Bearer ' + tok})
              with urllib.request.urlopen(req, timeout=40) as resp:
                  body = json.loads(resp.read())
              return [m.get('id') for m in body.get('data', [])]


          def invoke(model_id):
              tok = provide_token(region=region)
              payload = json.dumps({
                  'model': model_id,
                  'input': 'ping',
                  'max_output_tokens': 16,
              }).encode()
              req = urllib.request.Request(
                  base_url(model_id) + '/responses',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': 'Bearer ' + tok,
                      'Content-Type': 'application/json',
                  })
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.loads(resp.read())


          try:
              ids = catalogue()
              sys.stderr.write('    Mantle catalogue in ' + region + ': '
                               + str(len(ids)) + ' ids\n')
          except Exception as exc:
              sys.stderr.write('    Mantle catalogue unreachable: '
                               + type(exc).__name__ + ': ' + str(exc) + '\n')
              ids = None

          any_ok = False
          for model_id in candidates:
              if ids is not None and model_id not in ids:
                  sys.stderr.write('    ' + model_id
                                   + ' is not offered in ' + region + '\n')
                  print('unavailable  [mantle]   ' + model_id)
                  continue
              ok = False
              for attempt in range(1, ATTEMPTS + 1):
                  try:
                      body = invoke(model_id)
                      if body.get('status') == 'completed':
                          ok = True
                          break
                      detail = 'status=' + str(body.get('status'))
                  except urllib.error.HTTPError as exc:
                      detail = 'HTTP ' + str(exc.code) + ' ' + exc.read()[:200].decode(
                          'utf-8', 'replace')
                  except Exception as exc:
                      detail = type(exc).__name__ + ': ' + str(exc)
                  if attempt == 1:
                      sys.stderr.write('    First call to ' + model_id
                                       + ' failed. Retrying in case it is'
                                       + ' transient; a 401 access_denied here'
                                       + ' will not clear by retrying.\n')
                  sys.stderr.write('    attempt ' + str(attempt) + ': '
                                   + detail + '\n')
                  if time.monotonic() - started > DEADLINE_S:
                      sys.stderr.write('    Mantle probe budget of '
                                       + str(DEADLINE_S) + 's exhausted; '
                                       + 'giving up on the remaining attempts.\n')
                      break
                  if attempt < ATTEMPTS:
                      time.sleep(SLEEP_S)
              if ok:
                  any_ok = True
                  print('available    [mantle]   ' + model_id)
                  sys.stderr.write('    Model available: ' + model_id + '\n')
              else:
                  print('unavailable  [mantle]   ' + model_id)
                  sys.stderr.write('    Model unavailable after retries: '
                                   + model_id + '\n')

          sys.exit(0 if any_ok else 1)
          PROBE
          chmod 0644 /tmp/probe-mantle.py

          # [bedrock] runs first so it leads the report -- it is the main line.
          # nova-2-lite is what ch02/ch03 use. The Claude ids follow because the
          # ch03 container path is hard-pinned to Anthropic, and availability
          # differs per account: sonnet-5 is denied in some, and sonnet-4-6 is
          # not in the console dropdown (needs `Custom model ID…`).
          for MODEL_ID in global.amazon.nova-2-lite-v1:0 global.anthropic.claude-sonnet-5 global.anthropic.claude-sonnet-4-6; do
            MODEL_OK=no
            for ATTEMPT in $(seq 1 9); do
              if aws bedrock-runtime converse \
                   --region "${AWS::Region}" \
                   --model-id "${!MODEL_ID}" \
                   --messages '[{"role":"user","content":[{"text":"ping"}]}]' \
                   --inference-config '{"maxTokens":1}' \
                   >/dev/null 2>/tmp/model-ping.err; then
                MODEL_OK=yes
                break
              fi
              if [ "${!ATTEMPT}" -eq 1 ]; then
                echo "First call to ${!MODEL_ID} failed; retrying. A persistent failure means the account cannot use it. See /tmp/model-ping.err."
              fi
              sleep 20
            done
            if [ "${!MODEL_OK}" = yes ]; then
              echo "available    [bedrock]  ${!MODEL_ID}" >>"$MODEL_REPORT"
              echo "Model available: ${!MODEL_ID}"
            else
              echo "unavailable  [bedrock]  ${!MODEL_ID}" >>"$MODEL_REPORT"
              echo "Model unavailable after retries: ${!MODEL_ID}" >&2
              sed -e 's/^/    /' /tmp/model-ping.err >&2 || true
            fi
          done

          # [mantle] is probed after [bedrock] and appended below it. The lab does
          # not use this surface; it is reported so participants can see it exists
          # and switch to it deliberately.
          MANTLE_OUT=/tmp/mantle-probe.out
          if runuser -u ubuntu -- env \
               HOME=/home/ubuntu \
               PATH=/usr/local/bin:/usr/bin:/usr/sbin:/bin:/sbin \
               AWS_REGION="${AWS::Region}" \
               AWS_DEFAULT_REGION="${AWS::Region}" \
               uv run --quiet --no-project --directory /tmp \
                 --with aws-bedrock-token-generator \
                 python3 /tmp/probe-mantle.py "${AWS::Region}" \
                 openai.gpt-oss-120b openai.gpt-oss-20b \
                 >"$MANTLE_OUT"; then
            echo "Bedrock Mantle is reachable (optional path)."
          else
            echo "No Mantle model invocable. Does NOT affect the lab (main line is Converse)." >&2
          fi
          cat "$MANTLE_OUT" >>"$MODEL_REPORT" || true

          chown ubuntu:ubuntu "$MODEL_REPORT"
          # Fail only when the whole [bedrock] surface is dead. See YAML note.
          if ! grep -q '^available    \[bedrock\]' "$MODEL_REPORT"; then
            echo "No Bedrock Converse model is invocable in this account; the lab cannot run." >&2
            signal_failure
            exit 1
          fi
          if ! grep -q '^available    \[bedrock\]  global.amazon.nova-2-lite-v1:0' "$MODEL_REPORT"; then
            echo "WARNING: nova-2-lite unavailable. Content numbers assume it; name a substitute or move team." >&2
          fi
          if ! grep -q '^available    \[bedrock\]  global.anthropic' "$MODEL_REPORT"; then
            echo "WARNING: no Anthropic model. ch03 container path deploys but cannot chat." >&2
          fi

          # Publish the console. See the YAML comment above UserData.
          STACK_UUID="$(printf '%s' "${AWS::StackId}" | awk -F/ '{print $3}')"
          ADMIN_PASSWORD="$(printf '%s' "$STACK_UUID" | awk -F- '{print $1 $5}')"
          ORIGIN_KEY="$(printf '%s' "$STACK_UUID" | awk -F- '{print $5 $1 $4}')"

          APP=/home/ubuntu/agentcore_launchpad
          UPATH=/usr/local/bin:/usr/bin:/usr/sbin:/bin:/sbin
          RUNAS="runuser -u ubuntu -- env HOME=/home/ubuntu PATH=$UPATH"

          echo "Building the frontend bundle (vite preview serves dist/)..."
          $RUNAS bash -c "cd $APP/frontend && npm run build"

          # 0600 because it carries the password; the unit file itself is 0644.
          install -m 0600 /dev/null /etc/launchpad-auth.env
          cat >/etc/launchpad-auth.env <<ENV
          LAUNCHPAD_AUTH_USERNAME=admin
          LAUNCHPAD_AUTH_PASSWORD=$ADMIN_PASSWORD
          LAUNCHPAD_RUN_MODE=prod
          LAUNCHPAD_AUTH_COOKIE_SECURE=true
          LAUNCHPAD_AUTH_REGISTRATION_ENABLED=false
          LAUNCHPAD_REGION=${AWS::Region}
          AWS_REGION=${AWS::Region}
          AWS_DEFAULT_REGION=${AWS::Region}
          HOME=/home/ubuntu
          PATH=$UPATH
          ENV

          cat >/etc/systemd/system/launchpad-backend.service <<UNIT
          [Unit]
          After=network-online.target
          [Service]
          User=ubuntu
          WorkingDirectory=$APP/backend
          EnvironmentFile=/etc/launchpad-auth.env
          ExecStart=/usr/local/bin/uv run uvicorn app.main:app --host 127.0.0.1 --port 8000
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          UNIT

          install -m 0640 -o root -g www-data /dev/null /etc/nginx/sites-available/launchpad
          cat >/etc/nginx/sites-available/launchpad <<NGINX
          server {
            listen 80 default_server;
            if (\$http_x_launchpad_origin_key != "$ORIGIN_KEY") { return 403; }
            client_max_body_size 64m;
            location ~ ^/(api|v1)/ {
              proxy_pass http://127.0.0.1:8000;
              proxy_http_version 1.1;
              proxy_buffering off;
              proxy_read_timeout 3600s;
              proxy_set_header Host \$host;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            }
            location / {
              root $APP/frontend/dist;
              try_files \$uri /index.html;
            }
          }
          NGINX
          chmod 0640 /etc/nginx/sites-available/launchpad
          chmod o+x /home/ubuntu /home/ubuntu/agentcore_launchpad \
            /home/ubuntu/agentcore_launchpad/frontend

          rm -f /etc/nginx/sites-enabled/default
          ln -s /etc/nginx/sites-available/launchpad /etc/nginx/sites-enabled/launchpad
          nginx -t
          systemctl daemon-reload
          systemctl enable --now launchpad-backend
          systemctl restart nginx

          echo "Waiting for the console to answer locally..."
          UP=no
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1 \
               && curl -fs -o /dev/null -H "X-Launchpad-Origin-Key: $ORIGIN_KEY" \
                  http://127.0.0.1/ 2>/dev/null; then UP=yes; break; fi
            sleep 5
          done
          # Fail closed: no console, or a console with the login gate off, must not ship.
          if [ "$UP" != yes ] || ! curl -fs http://127.0.0.1:8000/api/auth/status \
             | grep -q '"auth_required":true'; then
            echo "Console down or auth gate off; refusing to publish." >&2
            journalctl -u launchpad-backend --no-pager -n 40 >&2 || true
            nginx -T 2>&1 | tail -5 >&2 || true
            signal_failure
            exit 1
          fi

          cat >/home/ubuntu/WORKSHOP-READY.txt <<READY
          Ready. The lab runs in the browser: open ConsoleUrl from the event
          Outputs and sign in as admin. No shell access needed.

          Models: /home/ubuntu/MODEL-ACCESS.txt
          Boot:   /var/log/workshop-bootstrap.log
          Status: systemctl status launchpad-backend nginx
          READY
          chown ubuntu:ubuntu /home/ubuntu/WORKSHOP-READY.txt

          signal_stack SUCCESS
          trap - ERR

Outputs:
  ConsoleUrl:
    Description: >
      Open this in a browser and sign in. No AWS CLI, no SSM tunnel.
    Value: !Sub "https://${ConsoleDistribution.DomainName}"
  ConsoleUsername:
    Description: Console sign-in username.
    Value: admin
  ConsolePassword:
    Description: >
      Console sign-in password for this team, derived from the stack id so each
      team gets its own.
    Value: !Join
      - ""
      - - !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
        - !Select [4, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
  InstanceId:
    Description: EC2 instance used for all workshop exercises.
    Value: !Ref WorkshopInstance
  SessionManagerUrl:
    Description: Open this URL to start a browser-based shell on the instance.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${WorkshopInstance}?region=${AWS::Region}"
  SessionManagerCommand:
    Description: AWS CLI command to start an interactive shell.
    Value: !Sub "aws ssm start-session --target ${WorkshopInstance} --region ${AWS::Region}"
  FrontendPortForwardCommand:
    Description: >
      Fallback only. The console is published at ConsoleUrl; this tunnel exists
      for debugging when the distribution or nginx is the thing under suspicion.
    Value: !Sub >-
      aws ssm start-session --target ${WorkshopInstance} --region ${AWS::Region}
      --document-name AWS-StartPortForwardingSession
      --parameters portNumber=5173,localPortNumber=5173
  RepositoryPath:
    Description: Location of the cloned AgentCore Launchpad repository.
    Value: /home/ubuntu/agentcore_launchpad
  BootstrapLog:
    Description: Command for monitoring instance setup.
    Value: sudo tail -n 200 /var/log/workshop-bootstrap.log
