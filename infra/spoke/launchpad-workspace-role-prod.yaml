AWSTemplateFormatVersion: "2010-09-09"

# LaunchpadWorkspaceRole (PROD) — the role an AgentCore Launchpad hub assumes to
# manage a RECEIVE-ONLY account: one that runs released agents and never builds
# them (docs/cross-account-workspaces.md, "Which template").
#
# This is `launchpad-workspace-role.yaml` with the build path taken out. The trust
# policy, parameters and everything the hub needs to deploy, invoke, observe and
# evaluate an agent are identical; the differences are exactly these, each also
# marked where it happened:
#
#   REMOVED  CodeBuildLaunchpad, CodeBuildListProjectsForAccessProbe
#            Nothing is built here. A production agent's image or archive arrives
#            by promotion (an artifact copy of the tested digest), so the hub has
#            no reason to create or start a CodeBuild project, and a compromised
#            hub credential cannot turn this account into a build farm or run
#            arbitrary build commands under the account's roles.
#   REMOVED  codebuild.amazonaws.com from PassLaunchpadRoles' PassedToService
#            With no CodeBuild permission there is no service to hand a role to.
#   REMOVED  EcrDescribeImagesForByoc (DescribeImages on EVERY repository)
#            In the standard template a BYOC container_image may come from any
#            repository the member already pushed to. Here images enter only by
#            promotion, into the one launchpad-agents repository, so DescribeImages
#            is scoped to it (EcrLaunchpad).
#   REMOVED  ecr:GetDownloadUrlForLayer, ecr:BatchGetImage (from EcrArtifactCopy)
#            Those are the SOURCE half of an artifact copy — reading layers out of
#            this account. Production is never a promotion source, so the role keeps
#            only the RECEIVING half (BatchCheckLayerAvailability, InitiateLayerUpload,
#            UploadLayerPart, CompleteLayerUpload, PutImage). No
#            ecr:GetAuthorizationToken either: the ECR API needs no docker login.
#   REMOVED  s3:DeleteObject (from S3Launchpad)
#            Released artifacts are the rollback and audit record; the hub cannot
#            erase them. Agent deletion still works — the orphaned object is the
#            deployer's best-effort cleanup, which tolerates a denial.
#   KEPT     everything else, unchanged: IAM for per-agent execution roles,
#            AgentCore/Registry, Bedrock knowledge bases, Cognito, observability,
#            Secrets Manager, KMS, STS. Deploy, invoke, observe and evaluate need
#            them all.
#
# KNOWN LIMIT: the hub's workspace bootstrap still probes CodeBuild and creates
# the launchpad-agent-builder project. Bootstrapping a workspace with THIS role
# fails at that stage until the bootstrap learns to skip it for a receive-only
# workspace.
#
# Deliberately plain CloudFormation rather than CDK, for the same reason as the
# standard template: an Organization admin deploys it by console upload,
# `aws cloudformation deploy`, or a StackSet targeting an OU. One IAM role and the
# customer managed policy attached to it, nothing else; deleting the stack revokes
# the hub's access.

Description: >-
  Cross-account role for an Amazon Bedrock AgentCore Launchpad hub to deploy and
  operate this account as a receive-only (production) Launchpad workspace. No
  build permissions.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Hub trust
        Parameters:
          - HubRoleArn
          - ExternalId
      - Label:
          default: Naming
        Parameters:
          - RoleName
    ParameterLabels:
      HubRoleArn:
        default: Hub role ARN (shown by the Launchpad console)
      ExternalId:
        default: ExternalId (must match the workspace registration)
      RoleName:
        default: Role name

Parameters:
  HubRoleArn:
    Type: String
    Description: >-
      The IAM role the Launchpad hub runs as (EC2 instance role, ECS task role,
      ...). The console displays it on the workspace registration form. Must be
      the iam: role ARN, not an sts: assumed-role ARN.
    AllowedPattern: "^arn:aws[a-z-]*:iam::\\d{12}:role/.+$"
    ConstraintDescription: >-
      must be an IAM role ARN, e.g. arn:aws:iam::111122223333:role/launchpad-hub

  ExternalId:
    Type: String
    Description: >-
      Shared secret the hub must present on sts:AssumeRole. Use the same value
      the workspace was registered with in the console; one value per workspace.
    MinLength: 2
    MaxLength: 128
    NoEcho: true
    # STS's own ExternalId character class (it allows up to 1224 characters; the
    # hub's ledger column caps it at 128, so this template caps it there too).
    AllowedPattern: "^[A-Za-z0-9+=,.@:/_-]{2,128}$"
    ConstraintDescription: >-
      2-128 characters of letters, digits or + = , . @ : / _ -

  RoleName:
    Type: String
    Description: Name of the role this stack creates in this account.
    Default: LaunchpadWorkspaceRoleProd
    AllowedPattern: "^[\\w+=,.@-]{1,64}$"

Resources:
  WorkspaceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      Description: >-
        Assumed by an AgentCore Launchpad hub to operate this account as a receive-only workspace.
      # Role chaining caps a chained session at one hour whatever this says, and
      # the hub asks for 3600 s and refreshes; a longer maximum buys nothing.
      MaxSessionDuration: 3600
      # Exactly two conditions of trust: one named hub role, and the ExternalId.
      #
      # Note the Principal.AWS role-ARN form is stored as the role's *unique id*
      # once the stack is created — deleting and recreating the hub role (same
      # name, new id) silently invalidates this trust, and AssumeRole then fails
      # with AccessDenied. Update the stack after any hub role replacement.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HubMayAssumeWithExternalId
            Effect: Allow
            Principal:
              AWS:
                Ref: HubRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      Tags:
        - Key: launchpad:role
          Value: workspace-prod
        # Which template, and which revision of it, this stack runs. Bump the version
        # whenever a statement changes (backend/tests/test_spoke_template_version.py
        # fails otherwise); the hub compares it with spoke_template.EXPECTED_VERSION.
        - Key: launchpad:template-version
          Value: "1"
      ManagedPolicyArns:
        - Ref: WorkspaceBedrockTelemetryPolicy
      Policies:
        - PolicyName: launchpad-workspace-prod
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ── IAM ────────────────────────────────────────────────────────
              # Launchpad creates four shared roles per region
              # (launchpad-agent-execution-role, launchpad-gateway-role,
              # launchpad-kb-role, launchpad-codebuild-role, each optionally
              # `-{region}` suffixed) and one launchpad-agent-<name>-<id> role
              # per agent, with inline policies named launchpad-*. Every name it
              # writes starts with `launchpad-`, which is what makes this
              # statement scopable. CreateRole is called with Tags=, so IAM
              # evaluates TagRole on it as well — granting only CreateRole makes
              # role creation fail on the tagging check.
              - Sid: IamOnLaunchpadRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:SimulatePrincipalPolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/launchpad-*"

              # ── project permissions boundaries (projects design §10.3) ────
              # An isolated project's agent roles carry a permissions boundary:
              # one customer managed policy per (project, workspace) named
              # launchpad-project-<pid>[-<region>], rewritten as a new version
              # when the project's KBs or Connections change (IAM keeps five
              # versions, so the oldest non-default one is deleted first).
              # CreatePolicy is called with Tags=, hence TagPolicy.
              - Sid: IamProjectBoundaryPolicies
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyTags
                  - iam:ListPolicyVersions
                  - iam:TagPolicy
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/launchpad-project-*"

              # Attaching the boundary to an agent role that predates its
              # project's isolation. The condition is what keeps this from
              # being "set any boundary", which could swap in a wider policy.
              - Sid: IamProjectBoundaryOnAgentRoles
                Effect: Allow
                Action:
                  - iam:PutRolePermissionsBoundary
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/launchpad-agent-*"
                Condition:
                  StringLike:
                    iam:PermissionsBoundary:
                      Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/launchpad-project-*"

              # Makes "an isolated project's agent role without a boundary"
              # impossible at the IAM layer, not only in code: a CreateRole
              # tagged launchpad:isolation=isolated must name a
              # launchpad-project-* boundary (StringNotLike is true when no
              # boundary is passed at all). Shared projects' roles carry no such
              # tag and are unaffected. DeleteRolePermissionsBoundary is never
              # granted, so a boundary once set stays.
              - Sid: IamIsolatedAgentRolesNeedABoundary
                Effect: Deny
                Action:
                  - iam:CreateRole
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/launchpad-agent-*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/launchpad:isolation": isolated
                  StringNotLike:
                    iam:PermissionsBoundary:
                      Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/launchpad-project-*"

              # The bootstrap job's validate-access stage probes iam:ListRoles to
              # fail early on a missing role rather than mid-provisioning.
              # ListRoles takes no resource, so it cannot be scoped.
              - Sid: IamListRolesForAccessProbe
                Effect: Allow
                Action:
                  - iam:ListRoles
                Resource: "*"

              # The hub reads THIS role's own tags (GetRole returns them) to compare
              # launchpad:template-version with the version it expects, and warns in
              # the console when the stack is older than the template in the repo.
              # Only the role itself: `role/launchpad-*` above does not match it (IAM
              # matches ARNs case-sensitively).
              - Sid: ReadOwnRoleForTemplateVersion
                Effect: Allow
                Action:
                  - iam:GetRole
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}"

              # PassRole is never *called* by the hub: it is the implicit check
              # AWS performs when a role ARN is handed to a service. Launchpad
              # passes launchpad-* roles to AgentCore (CreateAgentRuntime,
              # CreateHarness, CreateGateway, CreateMemory,
              # CreateOnlineEvaluationConfig) and to Bedrock (CreateKnowledgeBase);
              # the CodeBuild leg of the standard template is removed. The condition
              # is what stops this from being "pass any launchpad role anywhere".
              - Sid: PassLaunchpadRoles
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/launchpad-*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - bedrock.amazonaws.com
                      - bedrock-agentcore.amazonaws.com

              # NOT derivable from the hub's call sites: a virgin account has no
              # AgentCore service-linked roles yet and the first control-plane
              # call creates them. This list is carried over from a
              # least-privilege policy that was validated live against the same
              # console (workshop participant policy), so treat it as observed
              # rather than inferred, and as the statement most likely to need an
              # addition on a future AgentCore feature.
              - Sid: CreateServiceLinkedRoles
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike:
                    iam:AWSServiceName:
                      - agent-registry.amazonaws.com
                      - application-signals.cloudwatch.amazonaws.com
                      - bedrock-agentcore.amazonaws.com
                      - identity-network.bedrock-agentcore.amazonaws.com
                      - network.bedrock-agentcore.amazonaws.com
                      - runtime-identity.bedrock-agentcore.amazonaws.com

              # ── S3 ─────────────────────────────────────────────────────────
              # The artifacts bucket is launchpad-artifacts-<account>-<region>:
              # agent source zips, skill bundles, canary payloads. Bucket- and
              # object-level actions share one statement (the bucket ARN and the
              # /* ARN); an action that does not apply to one of the two is
              # simply never authorized against it.
              - Sid: S3Launchpad
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListMultipartUploadParts
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutObject
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::launchpad-*"
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::launchpad-*/*"

              # validate-access probes s3:ListBuckets, which is account-wide by
              # definition. It reveals bucket names and nothing else.
              - Sid: S3ListAllMyBucketsForAccessProbe
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                Resource: "*"

              # ── ECR ────────────────────────────────────────────────────────
              # Receive-only. Images arrive by promotion: the hub copies the tested
              # digest into the launchpad-agents repository through the ECR API
              # (roadmap T24), then reads back its digest and scan findings. No
              # build, no docker login (GetAuthorizationToken), and no read of
              # layers out of this account (GetDownloadUrlForLayer/BatchGetImage).
              # TagResource / ListTagsForResource: the shared repository's cost tags
              # (launchpad:project=shared, cost-tags design §1.2), at create
              # (CreateRepository with tags=) and by the cost_tags_backfill job.
              - Sid: EcrLaunchpad
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DescribeImageScanFindings
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:ListTagsForResource
                  - ecr:TagResource
                  - ecr:UntagResource
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/launchpad-agents"

              # The receiving half of an artifact copy, on the one repository.
              - Sid: EcrArtifactReceive
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/launchpad-agents"

              # validate-access calls DescribeRepositories without naming one,
              # which IAM evaluates against every repository in the account.
              - Sid: EcrDescribeRepositoriesForAccessProbe
                Effect: Allow
                Action:
                  - ecr:DescribeRepositories
                Resource: "*"

              # ── CodeBuild ── REMOVED (see the header) ──────────────────────

              # ── AgentCore + Agent Registry ─────────────────────────────────
              # Wildcarded on purpose. These are preview services: the console
              # spans runtimes, harnesses, gateways and their targets, memories,
              # policy engines and policies, evaluators, datasets, batch
              # evaluations, configuration bundles, A/B tests, online evaluation
              # configs, credential providers, registries and registry records —
              # control plane and data plane — and every List*/Create* call in
              # that set is account-scoped rather than resource-scoped, so an ARN
              # list would grant nothing while breaking on the next API. The
              # boundary here is that this role only reaches THIS account.
              # The wildcard includes bedrock-agentcore:TagResource and
              # agent-registry:TagResource: the launchpad:project / launchpad:workspace
              # tags on an isolated project's runtimes, harnesses, memories and
              # registry records (projects design §10.8, §10.9).
              - Sid: AgentCoreAndRegistry
                Effect: Allow
                Action:
                  - agent-registry:*
                  - bedrock-agentcore:*
                Resource: "*"

              # ── Cognito ────────────────────────────────────────────────────
              # The RESOURCE cannot be scoped: a user pool's ARN contains the pool
              # id AWS assigns at creation, so the pool Launchpad is about to
              # create cannot be named in advance, and ListUserPools (how the
              # bootstrap finds an existing pool) is account-wide regardless.
              # Scoping it would take a two-pass rollout: deploy, then re-deploy
              # with the pool id. The ACTIONS are enumerated even so — a spoke
              # account may hold user pools that have nothing to do with
              # Launchpad, and `cognito-idp:*` on `*` would let the hub delete
              # them. Pool + resource server + app clients + domain + groups come
              # from the bootstrap's cognito stage, and an isolated project's
              # scope, group and M2M client from project_provision's m2m stage
              # (Update* adds the project scope; projects design §10.6); the Admin* calls and
              # InitiateAuth are the console's per-user Gateway policy identity.
              - Sid: CognitoIdp
                Effect: Allow
                Action:
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:CreateGroup
                  - cognito-idp:CreateResourceServer
                  - cognito-idp:CreateUserPool
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:DescribeResourceServer
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:DescribeUserPoolDomain
                  - cognito-idp:InitiateAuth
                  - cognito-idp:ListUserPoolClients
                  - cognito-idp:ListUserPools
                  - cognito-idp:UpdateResourceServer
                  - cognito-idp:UpdateUserPoolClient
                Resource: "*"

              # ── Secrets Manager (AgentCore Identity token vault) ──────────
              # LIVE-OBSERVED, not call-site derivable (2026-08-13, first spoke
              # bootstrap): CreateOauth2CredentialProvider fails with "not
              # authorized to perform: secretsmanager:CreateSecret" — the
              # Identity token vault stores provider credentials as Secrets
              # Manager secrets under the caller's own permissions. Scoped to
              # the vault's fixed prefix.
              - Sid: SecretsManagerForTokenVault
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:UpdateSecret
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:bedrock-agentcore-identity!*"

              # ── KMS ────────────────────────────────────────────────────────
              # Also NOT derivable from call sites (same provenance as
              # CreateServiceLinkedRoles): AgentCore encrypts memory and session
              # state with service-managed keys and the caller is evaluated on
              # them.
              - Sid: KmsForAgentCore
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                  - kms:ListAliases
                  - kms:ListKeys
                Resource: "*"

              # ── S3 Files / EFS (read-only) ───────────────────────────────────
              # Storage catalog check (storage-mounts §4.4): the access point, its
              # file system and mount targets an Agent would mount.
              - Sid: StorageCatalogCheck
                Effect: Allow
                Action:
                  - elasticfilesystem:DescribeAccessPoints
                  - elasticfilesystem:DescribeFileSystems
                  - elasticfilesystem:DescribeMountTargetSecurityGroups
                  - elasticfilesystem:DescribeMountTargets
                  - s3files:GetAccessPoint
                  - s3files:GetFileSystem
                  - s3files:GetMountTarget
                  - s3files:ListAccessPoints
                  - s3files:ListMountTargets
                Resource: "*"

              # ── EC2 (read-only) ─────────────────────────────────────────────
              # Network profile preflight (design projects §12.4): describe the
              # subnets, security groups, routes and endpoints an Agent would use.
              - Sid: Ec2DescribeForNetworkPreflight
                Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeNatGateways
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcAttribute
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeVpcs
                Resource: "*"

              # ── STS ────────────────────────────────────────────────────────
              # The first call of every bootstrap run: validate-access asserts the
              # assumed identity really lives in the account the workspace
              # declares. GetCallerIdentity needs no permission (not even an
              # explicit Deny stops it), so this statement grants nothing — it is
              # here to state that the hub reads its own identity in this account,
              # which a CloudTrail reader will see.
              - Sid: Sts
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"

  # The Bedrock and telemetry grants live in a customer managed policy rather than
  # inline: IAM caps the inline policies of one role at 10240 characters in total
  # (whitespace excluded), and the hub's permission set outgrew that. A managed
  # policy has its own 6144-character cap, and attaching it through the role's
  # ManagedPolicyArns makes CloudFormation create it BEFORE it updates the role, so
  # moving statements between the two never opens a gap. The hub cannot edit it:
  # its IAM policy grants are scoped to launchpad-project-* (IamProjectBoundaryPolicies).
  # infra/tests/test_spoke_template*.py guard both sizes.
  WorkspaceBedrockTelemetryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: "${RoleName}-bedrock-telemetry"
      Description: >-
        Bedrock (knowledge bases, models, guardrails) and observability grants of the
        AgentCore Launchpad workspace role.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ── Bedrock (Managed Knowledge Bases) ──────────────────────────
          # `bedrock:` is the IAM prefix of the bedrock-agent control plane
          # and bedrock-agent-runtime data plane, which is how Launchpad
          # manages Managed KBs. `Retrieve` is the console's own retrieval
          # preview. Agentic retrieval is deliberately absent: agents reach it
          # through the gateway under their own execution role, and
          # AgenticRetrieveStream cannot be resource-scoped at all, so it does
          # not belong in a knowledge-base-scoped statement. TagResource /
          # ListTagsForResource: an isolated project's KBs carry its
          # launchpad:project tags, also when an existing KB moves to the
          # project (projects design §10.5).
          - Sid: BedrockKnowledgeBases
            Effect: Allow
            Action:
              - bedrock:CreateDataSource
              - bedrock:DeleteDataSource
              - bedrock:DeleteKnowledgeBase
              - bedrock:GetDataSource
              - bedrock:GetKnowledgeBase
              - bedrock:ListDataSources
              - bedrock:ListIngestionJobs
              - bedrock:ListKnowledgeBaseDocuments
              - bedrock:ListTagsForResource
              - bedrock:Retrieve
              - bedrock:StartIngestionJob
              - bedrock:TagResource
              - bedrock:UntagResource
              - bedrock:UpdateKnowledgeBase
            Resource:
              Fn::Sub: "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:knowledge-base/*"

          # A knowledge base has no ARN before it exists, and ListKnowledgeBases has
          # no resource type at all.
          - Sid: BedrockCreateKnowledgeBase
            Effect: Allow
            Action:
              - bedrock:CreateKnowledgeBase
              - bedrock:ListKnowledgeBases
              - bedrock:TagResource
            Resource: "*"
          # ── Bedrock (model inference) ──────────────────────────────────────────────
          # The hub itself calls models: intent clustering and answer suggestions
          # (Converse), prompt optimization (ConverseStream), and AgentCore's test
          # invoke of a judge model on CreateEvaluator, which runs with the caller's
          # credentials. Cross-region and global inference profiles resolve to a
          # foundation model in any region (global ones with no region), so both are
          # listed. Agents invoke under their own execution roles, not this one.
          - Sid: BedrockModelInference
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
              - Fn::Sub: "arn:${AWS::Partition}:bedrock:::foundation-model/*"
              - Fn::Sub: "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Fn::Sub: "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:application-inference-profile/*"

          # ── Bedrock application inference profiles (projects design §10.8) ──
          # Behind the hub's project_inference_profiles setting: one profile per
          # (isolated project, model), copied from the model or the system
          # cross-region profile the agent names and tagged launchpad:project,
          # so model spend splits by project. CreateInferenceProfile is called
          # with tags= (hence TagResource); TO VERIFY live whether it also
          # authorizes against the copyFrom source, which is why the model and
          # system-profile ARNs are listed next to the application profiles.
          - Sid: BedrockApplicationInferenceProfiles
            Effect: Allow
            Action:
              - bedrock:CreateInferenceProfile
              - bedrock:GetInferenceProfile
              - bedrock:TagResource
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:application-inference-profile/*"
              - Fn::Sub: "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Fn::Sub: "arn:${AWS::Partition}:bedrock:*::foundation-model/*"

          # A profile found by name after a run died between create and record:
          # ListInferenceProfiles takes no resource.
          - Sid: BedrockListInferenceProfiles
            Effect: Allow
            Action:
              - bedrock:ListInferenceProfiles
            Resource: "*"

          # ── Bedrock Guardrails (the workspace PII preset) ──────────────────────────
          - Sid: BedrockGuardrails
            Effect: Allow
            Action:
              - bedrock:ApplyGuardrail
              - bedrock:GetGuardrail
            Resource:
              Fn::Sub: "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:guardrail/*"

          # Listing has no resource type, and a guardrail has no ARN before it exists.
          - Sid: BedrockGuardrailsCreate
            Effect: Allow
            Action:
              - bedrock:CreateGuardrail
              - bedrock:ListGuardrails
            Resource: "*"

          # ── Observability ──────────────────────────────────────────────
          # Logs Insights queries over aws/spans and
          # /aws/bedrock-agentcore/runtimes/*, the CloudWatch token-usage
          # metrics, the account-level X-Ray span destination, and the log
          # delivery pipeline the policy engine's decision log needs. None of
          # StartQuery's siblings (GetQueryResults, StopQuery,
          # DescribeLogGroups) accept a resource, and the account-level X-Ray
          # setting has no ARN at all.
          - Sid: Observability
            Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - cloudwatch:ListMetrics
              - logs:CreateDelivery
              - logs:DescribeDeliveries
              - logs:DescribeLogGroups
              - logs:DescribeResourcePolicies
              - logs:FilterLogEvents
              - logs:GetDeliveryDestination
              - logs:GetDeliverySource
              - logs:GetQueryResults
              - logs:PutDeliveryDestination
              - logs:PutDeliverySource
              - logs:PutResourcePolicy
              - logs:StartQuery
              - logs:StopQuery
              - xray:GetTraceSegmentDestination
              - xray:UpdateTraceSegmentDestination
            Resource: "*"

          # ── Transaction Search (X-Ray → CloudWatch Logs) ───────────────
          # LIVE-OBSERVED, not call-site derivable (2026-10-07, first bootstrap
          # of a fresh region from an EC2 hub): UpdateTraceSegmentDestination is
          # refused with AccessDenied ("An unknown error occurred") unless the
          # caller ALSO holds the permissions the service exercises on its
          # behalf — the indexing rule, the aws/spans log group, Application
          # Signals discovery and its service-linked role / channel. Without
          # them a new-region workspace has no aws/spans group, so traces,
          # observability and every evaluation of that workspace read nothing.
          # Taken verbatim from "Enable Transaction Search" in the CloudWatch
          # user guide, scoped exactly as it scopes them.
          - Sid: TransactionSearchIndexing
            Effect: Allow
            Action:
              - application-signals:StartDiscovery
              - xray:GetIndexingRules
              - xray:UpdateIndexingRule
            Resource: "*"
          - Sid: TransactionSearchLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutRetentionPolicy
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:aws/spans:*"
              - Fn::Sub: "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/application-signals/data:*"
          - Sid: TransactionSearchServiceLinkedRole
            Effect: Allow
            Action:
              - iam:GetRole
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/application-signals.cloudwatch.amazonaws.com/AWSServiceRoleForCloudWatchApplicationSignals"
          - Sid: TransactionSearchCloudTrailChannel
            Effect: Allow
            Action:
              - cloudtrail:CreateServiceLinkedChannel
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:channel/aws-service-channel/application-signals/*"

          # ── Evaluation result log groups ───────────────────────────────
          # LIVE-OBSERVED, not call-site derivable (2026-10-07, first batch
          # evaluation in a fresh region): StartBatchEvaluation creates its
          # results log group with the CALLER's credentials (a forward access
          # session) and fails with "FAS credentials do not have permission to
          # create CloudWatch log groups. Ensure logs:CreateLogGroup is in the
          # FAS policy." The hub region only worked because its group already
          # existed. Batch results land under
          # /aws/bedrock-agentcore/evaluations/batch-evaluations/results/ and
          # online results under /aws/bedrock-agentcore/evaluations/results/, so
          # one prefix covers both. GetLogEvents is how the hub reads those
          # results back, per session (`agentcore_eval.results_stream` and its reader: the
          # run results route and the Agent-DLC criterion snapshot) — call-site
          # derivable, but it was missing, and only admin credentials hid that.
          - Sid: EvaluationResultLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:GetLogEvents
              - logs:PutLogEvents
              - logs:PutRetentionPolicy
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/evaluations/*"

          # ── Cost tags (cost-tags design §1.2 / §1.5) ───────────────────
          # An agent runtime's log groups carry its project's cost tags,
          # written by the cost_tags_backfill job. IAM roles (TagRole on
          # launchpad-*), AgentCore resources (bedrock-agentcore:*), KBs
          # (bedrock:TagResource) and the token vault's secrets
          # (secretsmanager:TagResource) are tagged under their own
          # statements.
          - Sid: CostTagsAgentLogGroups
            Effect: Allow
            Action:
              - logs:ListTagsForResource
              - logs:TagResource
              - logs:UntagResource
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"

          # The bill by launchpad:project (cost-tags design §1.4): Cost Explorer
          # and the cost-allocation-tag switch take no resource. Activating the
          # tags is optional — an organization member account is refused and
          # the console says so.
          - Sid: CostExplorerByTag
            Effect: Allow
            Action:
              - ce:GetCostAndUsage
              - ce:ListCostAllocationTags
              - ce:UpdateCostAllocationTagsStatus
            Resource: "*"

Outputs:
  RoleArn:
    Description: >-
      Register this ARN as the workspace's role ARN in the Launchpad console.
    Value:
      Fn::GetAtt:
        - WorkspaceRole
        - Arn
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-RoleArn"
