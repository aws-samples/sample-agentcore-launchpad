[workspace]
resolver = "2"
members = ["crates/lp-dogwood", "crates/lp-policy-engine"]

[workspace.package]
edition = "2024"
license = "MIT-0"
publish = false

[workspace.dependencies]
dogwood-local-engine = "=1.1.1"
dogwood-language = "=1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
