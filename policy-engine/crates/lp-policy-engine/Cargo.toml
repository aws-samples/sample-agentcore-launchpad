[package]
name = "lp-policy-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Launchpad policy engine service: the I4 data plane (TCP + HMAC) and I5 control socket over lp-dogwood"

[[bin]]
name = "launchpad-policy-engine"
path = "src/main.rs"

[dependencies]
lp-dogwood = { path = "../lp-dogwood" }
serde.workspace = true
serde_json.workspace = true
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
