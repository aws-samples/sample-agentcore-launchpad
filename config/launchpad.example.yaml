# AgentCore Launchpad configuration — example.
# The real file (config/launchpad.yaml) is generated by scripts/bootstrap.py
# and is gitignored because it contains account ids and demo credentials.

account_id: "123456789012"
region: cn-northwest-1

# N17-obs463: the IANA time zone every API time is returned in and the console shows
# (storage, logs and AWS stay UTC). Default Asia/Shanghai; env LAUNCHPAD_DISPLAY_TIMEZONE.
# display_timezone: Asia/Shanghai

# Optional local console login. Prefer LAUNCHPAD_AUTH_PASSWORD in the process
# environment so the password does not need to be written to this file.
auth_username: admin
# auth_password: "<set a strong password to enable console authentication>"
# auth_cookie_secure: true  # required when the console is served over HTTPS

resources:
  artifacts_bucket: launchpad-artifacts-123456789012-cn-northwest-1
  ecr_repo: launchpad-agents
  ecr_repo_uri: 123456789012.dkr.ecr.cn-northwest-1.amazonaws.com.cn/launchpad-agents
  codebuild_project: launchpad-agent-builder
  execution_role_arn: arn:aws-cn:iam::123456789012:role/launchpad-agent-execution-role
  # Registry, memory and KB resources are generated by the CN bootstrap.
  registry_id: ""
  registry_unavailable_reason: ""
  memory_id: ""

