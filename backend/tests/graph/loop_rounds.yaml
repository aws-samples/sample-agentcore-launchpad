# The loop-engine round ledger (round 17, r17-b; user ruling 2026-10-19 relayed by the lead).
#
# The GRAPH + LOOP discovery loop runs round after round with no fixed cap. After each round:
#   * it FOUND bugs (reproduced, classified, registered — PRODUCT / TEST / DOC all count)
#     → the next round runs the SAME method;
#   * it found NONE → the next round MUST use a DIFFERENT method / idea (walks → cross-graph
#     interleaving → fault-injected walks on the recorded seam error shapes → time-shifted walks
#     (clock injection) → role-swapped walks → concurrency pairs → …);
#   * the loop STOPS only after THREE CONSECUTIVE zero-yield rounds; any finding resets the streak.
# Prime-path coverage and capture–recapture are reference metrics only (testing.md §6.8).
#
# METHOD LADDER (what a zero-yield round switches to, in order): cross-graph interleaving (rounds
# 1–5) → FAULT-INJECTED WALKS on the recorded seam error shapes (/home/ubuntu/designs/seams-20261019:
# Runtime / Browser / OpenSearch responses replayed at the data-plane seams while the graphs walk;
# the oracle = the graphs' own contract answers + no half-written row) → time-shifted walks (clock
# injection: expiries, lockouts, retention sweeps mid-walk) → role-swapped walks (member / admin /
# other member at EVERY edge) → concurrency pairs (two walkers, one shared entity) → …
# ROUND 6 = fault-injected walks (round 5 yielded 0 → the method changed; testing.md §6.9). Round 6 FOUND
# bugs (12) → ROUND 7 kept the method (fresh window LAUNCHPAD_LOOP_ROUND=7, the canary cleanup / KB ingest /
# registry S3 seams) and FOUND bugs (4) → ROUND 8 kept the method (window 8: the eval poller's S3 artefact
# store, the extractor's SQS redelivery, the Identity vault behind the connection delete) and FOUND bugs (2)
# → ROUND 9 kept the method (window 9: the architect purge's AWS readbacks, the Skill Lab subprocess harness;
# Gateway targets are AWS-only state) and yielded ZERO → zero-yield streak 1/3 → ROUND 10 MUST SWITCH METHOD:
# TIME-SHIFTED WALKS with clock injection (expiries, lockouts, retention sweeps, the canary / purge / chat-claim
# deadlines mid-walk); role-swapped walks and concurrency pairs follow on the ladder.
#
# Append-only. `tests/graph/loop_report.py` renders the rounds into docs/cn/reports/graph-coverage.md
# ("round N · method · findings · streak") and scripts/quality_metrics.py reads those lines
# (`loop_round`, `loop_round_method`, `loop_round_findings`, `loop_zero_streak`).
