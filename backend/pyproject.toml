[project]
name = "launchpad-backend"
version = "0.1.0"
description = "AgentCore Launchpad — control-plane backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6.0,<7",
    "boto3>=1.43.66",
    "bedrock-agentcore[simulation]==1.17.*",
    "pip>=24",
    "playwright>=1.40,<2",
    "claude-agent-sdk>=0.2.116",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixtures under tests/fixtures/ are verbatim sample code (exported harness
# agents) consumed as text by the harness-conversion tests; they intentionally
# preserve their original, un-linted formatting, so exclude them from ruff.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
